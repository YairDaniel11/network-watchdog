# JVM שמשמש להרצת Gradle עצמו (לא קשור ל-minSdk של האפליקציה)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# הפרויקט לא משתמש ב-AndroidX/AppCompat בכלל (ראו הערה ב-app/build.gradle) -
# כדי לשמור על אפליקציה קלה במיוחד (RAM/סוללה) ותאימות למכשיר מקשים ישן.
android.useAndroidX=false
android.enableJetifier=false
